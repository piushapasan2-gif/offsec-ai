<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OffSec AI 2025 — Multi-LLM Pentesting Assistant</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/terminal.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<canvas id="matrix"></canvas>

<header>
  <div class="logo">
    <span class="brk">[</span>
    <span class="title">OffSec<span class="ai">AI</span></span>
    <span class="ver">v2025.2</span>
    <span class="brk">]</span>
  </div>
  <div class="status">
    <span id="dot" class="dot off"></span>
    <span id="status-text">connecting…</span>
    <span class="sep">|</span>
    <span id="provider-info">—</span>
    <span class="sep">|</span>
    <button onclick="window.offsecLogout()" style="background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--font);font-size:11px;padding:2px 8px;cursor:pointer;letter-spacing:1px;">logout</button>
  </div>
</header>

<main>
  <aside id="sidebar">
    <div class="section">
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>▎ LLM PROVIDERS</span>
      </div>
      <div id="llm-list" class="provider-list"></div>
    </div>
    <div class="section">
      <div class="section-title">▎ INTEL APIS</div>
      <div id="intel-list" class="provider-list"></div>
    </div>
    <div class="section">
      <div class="section-title">▎ SCOPE</div>
      <div id="scope-info" class="scope-info">loading…</div>
      <button id="scope-edit" class="btn-sm">edit scope</button>
    </div>
    <div class="section">
      <div class="section-title">▎ QUOTAS</div>
      <div id="quotas" class="quotas">—</div>
    </div>
    <div class="section">
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>▎ SESSIONS</span>
        <button id="new-chat-btn" class="btn-sm" style="font-size:10px;padding:1px 6px;">+ new</button>
      </div>
      <div id="session-list" class="provider-list" style="max-height:180px;overflow-y:auto;"></div>
    </div>
  </aside>

  <section id="chat-pane">
    <div id="messages"></div>
    <div id="thinking" class="thinking hidden">
      <span class="dots"><span></span><span></span><span></span></span>
      <span id="thinking-text">thinking…</span>
    </div>
    <form id="chat-form" class="chat-form">
      <select id="prefer" title="Prefer a specific LLM">
        <option value="">auto</option>
      </select>
      <input id="target" type="text" placeholder="target (optional)" />
      <textarea id="prompt" rows="2" placeholder="Ask anything security related… e.g. 'How do I kerberoast example.local?'"></textarea>
      <button type="submit" id="send-btn">▶ SEND</button>
    </form>
  </section>

  <section id="right-pane">
    <div class="pane-tabs">
      <button class="tab active" data-tab="intel">INTEL</button>
      <button class="tab" data-tab="audit">AUDIT</button>
      <button class="tab" data-tab="console">CONSOLE</button>
    </div>
    <div id="tab-intel" class="tab-pane active">
      <!-- Intel sub-tabs -->
      <div class="intel-subtabs">
        <button class="itab active" data-itab="scan">SCAN ALL</button>
        <button class="itab" data-itab="lookup">LOOKUP</button>
        <button class="itab" data-itab="history">HISTORY</button>
      </div>

      <!-- SCAN -->
      <div id="itab-scan" class="itab-pane active">
        <div class="bulk-bar">
          <input id="bulk-target" placeholder="IP address, domain, or hash…" />
          <button id="bulk-run" class="btn">▶ SCAN</button>
        </div>
        <div id="bulk-status" class="muted" style="font-size:11px;margin:4px 0;"></div>
        <div id="bulk-results"></div>
      </div>

      <!-- LOOKUP -->
      <div id="itab-lookup" class="itab-pane">
        <select id="intel-provider"></select>
        <select id="intel-action"></select>
        <input id="intel-arg" placeholder="ip / domain / hash / query" />
        <button id="intel-run" class="btn">RUN</button>
        <pre id="intel-output" class="output"></pre>
      </div>

      <!-- HISTORY -->
      <div id="itab-history" class="itab-pane">
        <button id="intel-history-refresh" class="btn-sm" style="margin-bottom:6px;">refresh</button>
        <div id="intel-history-list"></div>
      </div>
    </div>
    <div id="tab-audit" class="tab-pane">
      <h3>Audit Log</h3>
      <button id="audit-refresh" class="btn-sm">refresh</button>
      <pre id="audit-output" class="output"></pre>
    </div>
    <div id="tab-console" class="tab-pane">
      <h3>Live Events</h3>
      <pre id="console-output" class="output"></pre>
    </div>
  </section>
</main>

<script src="/js/app.js"></script>
</body>
</html>
